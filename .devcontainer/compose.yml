# Devcontainer services. Credentials are fixed development values; never reuse them.
name: lekto-dev

x-garage-admin-token: &garage-admin-token dev-garage-admin-token

# The environment of the `dev` container and of the CI job `integration` (which reads it with
# `docker compose config`): the fixed credentials of the services, for the integration tests
# (they derive their own databases, bucket prefixes and indexes). The development instance has
# its own settings in dev.env (see README.md).
x-test-environment: &test-environment
  LEKTO_LOG_FORMAT: console
  LEKTO_LOG_LEVEL: DEBUG
  # Encrypts TOTP secrets; required for the API. Production: `openssl rand -base64 32`.
  LEKTO_SECRET_KEY: ZGV2LWtleS1kZXYta2V5LWRldi1rZXktZGV2LWtleS0=
  # The first admin, created at API start while there is none.
  LEKTO_ADMIN_USERNAME: admin
  LEKTO_ADMIN_PASSWORD: lekto-dev-admin
  # The API is reached over plain HTTP during development.
  LEKTO_COOKIE_SECURE: "false"
  LEKTO_DB_TYPE: postgres
  LEKTO_DB_HOST: postgres
  LEKTO_DB_PORT: "5432"
  LEKTO_DB_NAME: lekto
  LEKTO_DB_USER: lekto
  LEKTO_DB_PASSWORD: lekto
  LEKTO_STORAGE_TYPE: s3
  LEKTO_S3_ENDPOINT_URL: http://garage:3900
  LEKTO_S3_REGION: garage
  LEKTO_S3_BUCKET: lekto
  LEKTO_S3_ACCESS_KEY_ID: GKdeadbeefdeadbeefdeadbeef
  LEKTO_S3_SECRET_ACCESS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  LEKTO_S3_PATH_STYLE: "true"
  LEKTO_MEILISEARCH_URL: http://meilisearch:7700
  LEKTO_MEILISEARCH_API_KEY: dev-meilisearch-master-key

services:
  dev:
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev
    command: sleep infinity
    environment: *test-environment
    volumes:
      - ..:/workspaces/lekto:cached
      - uv-cache:/home/vscode/.cache/uv
      - claude-config:/home/vscode/.claude
    extra_hosts:
      # Lets the container reach a Ollama on the host on Linux, too (built in on Docker Desktop).
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      meilisearch:
        condition: service_healthy

  postgres:
    image: postgres:17.11-trixie
    environment:
      POSTGRES_USER: lekto
      POSTGRES_PASSWORD: lekto
      POSTGRES_DB: lekto
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lekto -d lekto"]
      interval: 5s
      timeout: 3s
      retries: 20

  garage:
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_RPC_SECRET: "a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90"
      GARAGE_ADMIN_TOKEN: *garage-admin-token
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  # Creates layout, access key and bucket; safe to run on every start.
  garage-init:
    build: garage-init
    environment:
      <<: *test-environment
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: *garage-admin-token
      # The bucket of the development instance (dev.env, see README.md).
      LEKTO_S3_EXTRA_BUCKETS: lekto-dev
    depends_on:
      - garage
    restart: "no"

  meilisearch:
    image: getmeili/meilisearch:v1.54.3
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: dev-meilisearch-master-key
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  uv-cache:
  postgres-data:
  garage-meta:
  garage-data:
  meilisearch-data:
  claude-config:
    name: claude-config

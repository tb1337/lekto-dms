---
name-template: "Lekto $RESOLVED_VERSION 🦉"
tag-template: "v$RESOLVED_VERSION"

# A pull request's section "## Release notes" (one sentence for the user) stands under its title.
change-template: "- $TITLE ($NUMBERS)$BODY"
sort-by: merged_at
sort-direction: ascending

new-contributor-template: "- $AUTHOR_MENTION made their first contribution in #$NUMBER"
no-new-contributor-template: "<!-- no new contributors -->"

group-changes:
  - pattern: '/^(?:chore\(deps\): )?[Uu]pdate (?:dependency )?(?<group>.+?)(?: action| Docker tag)? to (?<to>\S+)$/'
    title-template: "Update $GROUP to $LAST_TO"
change-title-escapes: '\<*_&|'

replacers:
  - search: '/## 👋 New contributors\s*<!-- no new contributors -->\s*/'
    replace: ""
  - target: change-title
    search: '/^Web UI: (.*)$/'
    replace: '\u$1 `UI`'
  - target: change-body
    section: "## Release notes"
    not-found: empty
  - target: change-body
    search: '/<!--[\s\S]*?-->/g'
    replace: ""
  - target: change-body
    search: '/\s*\n\s*/g'
    replace: " "
  - target: change-body
    search: '/^\s+$/'
    replace: ""
  - target: change-body
    search: '/^\s*(\S[\s\S]*?)\s*$/'
    replace: "<br><sub>$1</sub>"

categories:
  - type: pre-exclude
    when:
      label: "skip-changelog"
  - title: "🚨 Breaking changes"
    semver-increment: major
    when:
      label: "breaking-change"
  - title: "✨ New features"
    semver-increment: minor
    when:
      label: "new-feature"
  - title: "🚀 Enhancements"
    when:
      labels:
        - "enhancement"
        - "refactor"
        - "performance"
  - title: "🐛 Bug fixes"
    when:
      label: "bugfix"
  - title: "📚 Documentation"
    when:
      label: "documentation"
  - title: "🧰 Maintenance"
    collapse-after: 0
    when:
      labels:
        - "maintenance"
        - "ci"
  - title: "⬆️ Dependencies"
    collapse-after: 0
    when:
      labels:
        - "dependencies"
        - "dev-deps"
  # The version alone, without a section of their own.
  - type: version-resolver
    semver-increment: major
    when:
      label: "major"
  - type: version-resolver
    semver-increment: minor
    when:
      label: "minor"
  - type: version-resolver
    semver-increment: patch

header: |
  <picture>
    <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/tb1337/lekto-dms/main/.github/release/banner-dark.svg">
    <img alt="Lekto" src="https://raw.githubusercontent.com/tb1337/lekto-dms/main/.github/release/banner-light.svg" width="100%">
  </picture>

  ![version](https://img.shields.io/static/v1?label=version&message=$RESOLVED_VERSION&color=0d6b6b) ![ghcr.io](https://img.shields.io/badge/ghcr.io-tb1337%2Flekto-0d6b6b)

template: |

  $CHANGES

footer: |

  ## 👋 New contributors

  $NEW_CONTRIBUTORS

  ## Upgrade

  > [!IMPORTANT]
  > Back up first. The image migrates the database when it starts, and a schema upgrade cannot
  > be undone.

  ```sh
  docker pull ghcr.io/tb1337/lekto:$RESOLVED_VERSION
  docker pull ghcr.io/tb1337/lekto-migration:$RESOLVED_VERSION
  ```

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

---
name-template: "Lekto $RESOLVED_VERSION 🦉"
tag-template: "v$RESOLVED_VERSION"

# Each line carries its category until the global replacers below have placed it.
change-template: "- [$CATEGORY] $TITLE ($NUMBERS)$BODY"
change-title-escapes: '\<*_&|'
sort-by: merged_at
sort-direction: ascending

new-contributor-template: "- $AUTHOR_MENTION made their first contribution in #$NUMBER"
no-new-contributor-template: "<!-- no new contributors -->"

group-changes:
  - pattern: '/^(?:chore\(deps\): )?[Uu]pdate (?:dependency )?(?<group>.+?)(?: action| Docker tag)? to (?<to>\S+)$/'
    title-template: "Update $GROUP to $LAST_TO"

replacers:
  - target: change-title
    search: '/^Web UI: (.*)$/'
    replace: '\u$1 `UI`'
  # The sections "## Release notes" and "## API" of the pull request text become ⟦notes⟧⟦api⟧.
  - target: change-body
    search: '/<!--[\s\S]*?-->/g'
    replace: ""
  - target: change-body
    search: '/^[\s\S]*?^## Release notes[ \t]*\n([\s\S]*?)(?:^## API[ \t]*\n([\s\S]*?))?(?=^## (?!API)|(?![\s\S]))[\s\S]*$/m'
    replace: "⟦$1⟧⟦$2⟧"
  - target: change-body
    search: '/^(?!⟦)[\s\S]*$/'
    replace: ""
  - target: change-body
    search: '/\s*\n\s*/g'
    replace: " "
  - target: change-body
    search: '/(⟦)\s+|\s+(⟧)/g'
    replace: "$1$2"
  # The REST API section shows what changed in the API, every other section the sentence for users.
  - search: '/^(- \[🧩 REST API\] .*?)⟦(.*?)⟧⟦(.*?)⟧$/gm'
    replace: "$1<br><sub>$3</sub>"
  - search: '/^(- \[[^\]\n]*\] .*?)⟦(.*?)⟧⟦(.*?)⟧$/gm'
    replace: "$1<br><sub>$2</sub>"
  - search: '/<br><sub><\/sub>/g'
    replace: ""
  # Drop the category from every line.
  - search: '/^- \[[^\]\n]*\] /gm'
    replace: "- "
  - search: '/## 👋 New contributors\s*<!-- no new contributors -->\s*/'
    replace: ""

categories:
  - type: pre-exclude
    when:
      label: "skip-changelog"
  - title: "🚨 Breaking changes"
    semver-increment: major
    when:
      label: "breaking-change"
  - title: "✨ New features"
    semver-increment: minor
    when:
      label: "new-feature"
  - title: "🚀 Enhancements"
    when:
      labels:
        - "enhancement"
        - "refactor"
        - "performance"
  - title: "🐛 Bug fixes"
    when:
      label: "bugfix"
  # Every change of the API changes web/openapi.json (a test keeps it current).
  - title: "🧩 REST API"
    when:
      path: "web/openapi.json"
  - title: "📚 Documentation"
    when:
      label: "documentation"
  - title: "🧰 Maintenance"
    collapse-after: 0
    when:
      labels:
        - "maintenance"
        - "ci"
  - title: "⬆️ Dependencies"
    collapse-after: 0
    when:
      labels:
        - "dependencies"
        - "dev-deps"
  # The version alone, without a section of their own.
  - type: version-resolver
    semver-increment: major
    when:
      label: "major"
  - type: version-resolver
    semver-increment: minor
    when:
      label: "minor"
  - type: version-resolver
    semver-increment: patch

header: |
  <picture>
    <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/tb1337/lekto-dms/main/.github/release/banner-dark.svg">
    <img alt="Lekto" src="https://raw.githubusercontent.com/tb1337/lekto-dms/main/.github/release/banner-light.svg" width="100%">
  </picture>

  ![version](https://img.shields.io/static/v1?label=version&message=$RESOLVED_VERSION&color=0d6b6b) ![ghcr.io](https://img.shields.io/badge/ghcr.io-tb1337%2Flekto-0d6b6b)

template: |

  $CHANGES

footer: |

  ## 👋 New contributors

  $NEW_CONTRIBUTORS

  ## Upgrade

  > [!IMPORTANT]
  > Back up first. The image migrates the database when it starts, and a schema upgrade cannot
  > be undone.

  ```sh
  docker pull ghcr.io/tb1337/lekto:$RESOLVED_VERSION
  docker pull ghcr.io/tb1337/lekto-migration:$RESOLVED_VERSION
  ```

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

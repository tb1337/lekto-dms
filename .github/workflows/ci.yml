name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a pull request cancels its running checks; every push to main is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# pytest runs with `-n logical`: `-n auto` counts physical cores, and a runner's two vCPUs are one,
# so the tests ran in a single process.

# Caches: only pushes to main write them, one entry per content (lock file);
# pull requests read main's entries. The uv cache is off: downloading the wheels is as fast as
# restoring them.
env:
  WRITE_CACHE: ${{ github.event_name == 'push' }}

jobs:
  # Which jobs the change needs. Jobs are skipped by `if`, not by `paths`, so that a skipped
  # job counts as passed for required checks.
  #
  # A pull request runs what its files touch; `integration`, `devcontainer` and `image` (the long
  # ones) wait until it is no draft, and `devcontainer` ignores lock files there. A push to main
  # runs the checks again only where they write a cache: `backend` (mypy) when the lock file
  # changed, `devcontainer` (layers) when its inputs or the lock file changed. Everything else was checked in the pull request, `image` too (it writes no cache).
  # `image` looks at what goes into the runtime image besides the code (Dockerfile, deploy/
  # without the Markdown files, the lock file, the web UI without its tests), not at the
  # backend's code: its tests cover that. `web` runs for changes below web/; on main only when
  # its lock file changed (to write the pnpm cache).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      integration: ${{ steps.diff.outputs.integration }}
      devcontainer: ${{ steps.diff.outputs.devcontainer }}
      image: ${{ steps.diff.outputs.image }}
      web: ${{ steps.diff.outputs.web }}
      migration: ${{ steps.diff.outputs.migration }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # Unknown base (new branch, force push): run everything.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
          else
            files=ALL
          fi
          echo "$files"
          matches() { [ "$files" = ALL ] || echo "$files" | grep -qE "$1"; }
          ci='^\.github/(workflows/ci\.yml|compose\.ci\.yml)$'
          lock='^backend/(pyproject\.toml|uv\.lock)$'
          # web/openapi.json: a backend test compares it with the API.
          code="^backend/|^web/openapi\.json$|^\.devcontainer/(compose\.yml|dev\.env|garage)|$ci"
          migration="^migration/|^web/openapi\.json$|$ci"
          # The backend's unit tests run the migration client against the API, too.
          backend_tests="$code|^migration/"
          web="^web/|^\.github/workflows/ci\.yml$"
          image="^(Dockerfile|\.dockerignore)$|^\.devcontainer/|$ci"
          runtime="^(Dockerfile|\.dockerignore)$|^deploy/|^web/|^\.github/workflows/ci\.yml$"
          # The runtime image's inputs. Documentation, the UI's tests and the API description (the
          # web job builds the client; its types leave nothing in the build) do not change it.
          not_in_image='^web/tests/|\.test\.ts$|^web/(openapi\.json|src/lib/api/schema\.ts|playwright\.config\.ts)$'
          runtime_changed() {
            [ "$files" = ALL ] || echo "$files" | grep -v '\.md$' \
              | grep -vE "$not_in_image" | grep -qE "$runtime|$lock"
          }
          if [ "$EVENT" = push ]; then
            matches "$lock|$ci" && echo "backend=true" >> "$GITHUB_OUTPUT"
            matches "$image|$lock" && echo "devcontainer=true" >> "$GITHUB_OUTPUT"
            matches "^web/pnpm-lock\.yaml$|$ci" && echo "web=true" >> "$GITHUB_OUTPUT"
            matches "$migration" && echo "migration=true" >> "$GITHUB_OUTPUT"
          else
            matches "$backend_tests" && echo "backend=true" >> "$GITHUB_OUTPUT"
            matches "$web" && echo "web=true" >> "$GITHUB_OUTPUT"
            matches "$migration" && echo "migration=true" >> "$GITHUB_OUTPUT"
            if [ "$DRAFT" != true ]; then
              matches "$code" && echo "integration=true" >> "$GITHUB_OUTPUT"
              matches "$image" && echo "devcontainer=true" >> "$GITHUB_OUTPUT"
              runtime_changed && echo "image=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          exit 0

  # Lint, types, import contracts and the unit tests (the SQL adapter on SQLite among them).
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - run: uv sync --locked
      # mypy's cache: most of its work are the dependencies, so one entry per lock file.
      - id: mypy-cache
        uses: actions/cache/restore@v5
        with:
          path: backend/.mypy_cache
          key: mypy-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml') }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - if: env.WRITE_CACHE == 'true' && steps.mypy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: backend/.mypy_cache
          key: ${{ steps.mypy-cache.outputs.cache-primary-key }}
      - run: uv run lint-imports
      - run: uv run pytest -m unit -n logical

  # The migration client (Paperless-ngx to Lekto): lint, types and tests against stand-ins for both
  # APIs. Fast on purpose (httpx2 is its only dependency); its tests against the real API run
  # in `backend`.
  migration:
    needs: changes
    if: needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: migration
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  # The web UI: lint, format, types, unit tests (Vitest in jsdom), the generated API client
  # against web/openapi.json, and the build. Playwright runs locally only (no browsers here).
  # The pnpm store is cached per lock file, written from main only.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - if: env.WRITE_CACHE == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - name: The API client matches openapi.json
        run: pnpm gen:api && git diff --exit-code src/lib/api/schema.ts
      - run: pnpm build

  # The integration tests against the devcontainer's services (Postgres, Garage, Meilisearch)
  # and the OCR programs, on the runner. No test may skip.
  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE: docker compose -f .devcontainer/compose.yml -f .github/compose.ci.yml
    steps:
      - uses: actions/checkout@v6
      - name: Configure from test.env, with the services on localhost
        run: |
          grep '^LEKTO_' .devcontainer/test.env \
            | sed -E 's#^LEKTO_DB_HOST=.*#LEKTO_DB_HOST=localhost#; s#//(garage|meilisearch):#//localhost:#' \
            >> "$GITHUB_ENV"
      - name: Start the services and install the OCR programs, in parallel
        run: |
          (
            sudo apt-get update -q
            sudo apt-get install --no-install-recommends -y -q \
              ghostscript pngquant qpdf tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng unpaper
          ) > "$RUNNER_TEMP/apt.log" 2>&1 &
          apt=$!
          $COMPOSE up -d --wait postgres meilisearch garage
          $COMPOSE run --rm garage-init
          wait $apt || { cat "$RUNNER_TEMP/apt.log"; exit 1; }
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - run: uv sync --locked
        working-directory: backend
      - name: Run the integration tests
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -m integration -n logical -v -rs | tee pytest.log
          # pytest marks skipped tests as SKIPPED; test names may contain "skipped".
          if grep -q SKIPPED pytest.log; then
            echo "Integration tests were skipped: a service or program is missing" >&2
            exit 1
          fi
      - name: Show service logs
        if: failure()
        run: $COMPOSE logs

  # The dev image, only when its inputs change. First amd64: the devcontainer's services start
  # like "Reopen in Container", Garage's init is repeatable, and the image's own OCR programs
  # work (`integration` tests the code). The build also writes the layer
  # cache: one scope, only from main. arm64 (Apple Silicon) is not built here: emulated, it was
  # slow and filled the runner's disk.
  devcontainer:
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f .devcontainer/compose.yml
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false
      # The tag is the image name Compose uses for `dev`.
      - name: Build for amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          load: true
          tags: papiq-dev-dev:latest
          cache-from: type=gha,scope=dev-image
          cache-to: ${{ env.WRITE_CACHE == 'true' && 'type=gha,scope=dev-image,mode=max' || '' }}
      - name: Start the services
        # Uses the image built above; builds only the small garage-init image.
        run: $COMPOSE up -d dev
      - name: Run Garage init a second time
        run: $COMPOSE run --rm garage-init
      - name: Check the tools in the dev container
        # As root: the checkout belongs to the runner user, not to the container's `vscode` user.
        run: |
          $COMPOSE exec -T -u root dev bash -e -o pipefail -c '
            uv sync --locked --project backend
            cd backend
            uv run pytest -n logical -v -rs tests/integration/test_services_reachable.py \
              tests/integration/adapters/ocrmypdf tests/integration/adapters/pdfium \
              | tee /tmp/pytest.log
            # pytest marks skipped tests as SKIPPED; test names may contain "skipped".
            if grep -q SKIPPED /tmp/pytest.log; then
              echo "Tests were skipped: a service or program is missing" >&2
              exit 1
            fi
          '
      - name: Show service logs
        if: failure()
        run: $COMPOSE logs

  # The runtime image, only when its inputs change, natively on each architecture (amd64 and
  # arm64 side by side; the arm64 runner replaces the emulation that was slow and filled the
  # disk). Builds the image without pushing it, then `deploy/test-image.sh` starts it with
  # SQLite: migration, health, user (never root), roles, a PDF through OCR and parsing, stop.
  # No layer cache: measured, a cold build takes 2.5 minutes, while restoring the cache takes
  # about one minute and writing it two more, and it would take space from the 10 GB of the
  # repository's caches.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false
      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: lekto:ci
      - name: Size of the image
        run: docker image inspect lekto:ci --format 'image size {{.Size}} bytes' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test the image
        run: deploy/test-image.sh lekto:ci

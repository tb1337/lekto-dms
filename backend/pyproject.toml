[project]
name = "lekto"
version = "0.0.0.dev0"
description = "Self-hosted, headless document management system"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "authlib>=1.8.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "joserfc>=1.7.5",
    "mcp==2.3.0",
    "ocrmypdf>=17.13.0",
    "pikepdf>=10.16.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyotp>=2.10.0",
    "pypdfium2>=5.14.0",
    "python-liquid>=2.3,<3",
    "python-multipart>=0.0.32",
    "regex>=2026.9.29",
    "scikit-learn>=1.9.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
    "zxing-cpp>=3.1.1",
]

[project.scripts]
# The command line (`python -m lekto.composition`); in the image, `lekto-run lekto ...`.
lekto = "lekto.composition.__main__:cli"

[dependency-groups]
dev = [
    "import-linter",
    "mypy",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff",
    # The migration client's own dependency (its plan), for the flow tests that run it.
    "ruamel.yaml==0.19.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# The migration client's package, which the flow tests in tests/unit/adapters/rest run against
# the API (it needs httpx2 and ruamel.yaml).
mypy_path = "../migration/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../migration/src"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: needs no external services (applied automatically to tests/unit)",
    "integration: needs Postgres, Garage, Meilisearch or the OCR programs (applied automatically to tests/integration)",
]

# Hexagonal boundaries, checked with `lint-imports`.
[tool.importlinter]
root_package = "lekto"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: composition -> adapters -> core"
type = "layers"
layers = [
    "lekto.composition",
    "lekto.adapters",
    "lekto.core",
]

[[tool.importlinter.contracts]]
name = "Inbound and outbound adapters are independent"
type = "independence"
modules = [
    "lekto.adapters.inbound",
    "lekto.adapters.outbound",
]

[[tool.importlinter.contracts]]
name = "Inbound adapters are independent of each other"
type = "independence"
modules = [
    "lekto.adapters.inbound.evaluation",
    "lekto.adapters.inbound.mcp",
    "lekto.adapters.inbound.rest",
    "lekto.adapters.inbound.worker",
]

[[tool.importlinter.contracts]]
name = "Outbound adapters are independent of each other"
type = "independence"
# Shared infrastructure, not adapters: `http_client`, `imaging` and `system`. OCRmyPDF checks
# the PDFs it makes with PDFium, and ZXing renders pages under PDFium's lock.
modules = [
    "lekto.adapters.outbound.crypto",
    "lekto.adapters.outbound.filesystem",
    "lekto.adapters.outbound.liquid",
    "lekto.adapters.outbound.logos",
    "lekto.adapters.outbound.meilisearch",
    "lekto.adapters.outbound.memory",
    "lekto.adapters.outbound.ocrmypdf",
    "lekto.adapters.outbound.oidc",
    "lekto.adapters.outbound.openai_compat",
    "lekto.adapters.outbound.pdfium",
    "lekto.adapters.outbound.pikepdf",
    "lekto.adapters.outbound.pillow",
    "lekto.adapters.outbound.regex",
    "lekto.adapters.outbound.s3",
    "lekto.adapters.outbound.sklearn",
    "lekto.adapters.outbound.sql",
    "lekto.adapters.outbound.webhooks",
    "lekto.adapters.outbound.zxing",
]
ignore_imports = [
    "lekto.adapters.outbound.ocrmypdf.engine -> lekto.adapters.outbound.pdfium",
    "lekto.adapters.outbound.zxing.reader -> lekto.adapters.outbound.pdfium.library",
]

[[tool.importlinter.contracts]]
name = "Service helpers do not import use cases"
type = "forbidden"
source_modules = [
    "lekto.core.services._access",
    "lekto.core.services._jobs",
    "lekto.core.services._templates",
    "lekto.core.services.objects",
]
forbidden_modules = ["lekto.core.services"]

[[tool.importlinter.contracts]]
name = "Domain model depends on nothing else in the core"
type = "forbidden"
source_modules = ["lekto.core.domain"]
forbidden_modules = ["lekto.core.ports", "lekto.core.services"]

[[tool.importlinter.contracts]]
name = "Core is plain Python: no framework or client libraries"
type = "forbidden"
source_modules = ["lekto.core"]
forbidden_modules = [
    "aioboto3",
    "aiobotocore",
    "aiosqlite",
    "alembic",
    "argon2",
    "asyncpg",
    "authlib",
    "boto3",
    "botocore",
    "cryptography",
    "fastapi",
    "httpx",
    "httpx2",
    "joblib",
    "joserfc",
    "mcp",
    "meilisearch",
    "numpy",
    "ocrmypdf",
    "PIL",
    "pikepdf",
    "pydantic",
    "pydantic_settings",
    "pyotp",
    "pypdfium2",
    "python_multipart",
    "regex",
    "scipy",
    "sklearn",
    "sqlalchemy",
    "starlette",
    "structlog",
    "threadpoolctl",
    "uvicorn",
    "zxingcpp",
]

# Libraries without type information.
[[tool.mypy.overrides]]
module = [
    "aioboto3.*",
    "aiobotocore.*",
    "authlib.*",
    "botocore.*",
    "pypdfium2.*",
    "regex.*",
    "sklearn.*",
]
ignore_missing_imports = true

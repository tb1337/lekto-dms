[project]
name = "papiq"
version = "0.1.0"
description = "Self-hosted, headless document management system"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "authlib>=1.8.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "joserfc>=1.7.5",
    "mcp==2.3.0",
    "ocrmypdf>=17.13.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyotp>=2.10.0",
    "pypdfium2>=5.14.0",
    "python-liquid>=2.3,<3",
    "python-multipart>=0.0.32",
    "regex>=2026.9.29",
    "scikit-learn>=1.9.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "import-linter",
    "mypy",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# The migration client's package, which the flow tests in tests/unit/adapters/rest run against
# the API (it needs nothing but httpx2).
mypy_path = "../migration/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../migration/src"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: needs no external services (applied automatically to tests/unit)",
    "integration: needs Postgres, Garage, Meilisearch or the OCR programs (applied automatically to tests/integration)",
]

# Hexagonal boundaries, checked with `lint-imports`.
[tool.importlinter]
root_package = "papiq"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: composition -> adapters -> core"
type = "layers"
layers = [
    "papiq.composition",
    "papiq.adapters",
    "papiq.core",
]

[[tool.importlinter.contracts]]
name = "Inbound and outbound adapters are independent"
type = "independence"
modules = [
    "papiq.adapters.inbound",
    "papiq.adapters.outbound",
]

[[tool.importlinter.contracts]]
name = "Inbound adapters are independent of each other"
type = "independence"
modules = [
    "papiq.adapters.inbound.evaluation",
    "papiq.adapters.inbound.mcp",
    "papiq.adapters.inbound.rest",
    "papiq.adapters.inbound.worker",
]

[[tool.importlinter.contracts]]
name = "Service helpers do not import use cases"
type = "forbidden"
source_modules = ["papiq.core.services._access", "papiq.core.services.objects"]
forbidden_modules = ["papiq.core.services"]

[[tool.importlinter.contracts]]
name = "Domain model depends on nothing else in the core"
type = "forbidden"
source_modules = ["papiq.core.domain"]
forbidden_modules = ["papiq.core.ports", "papiq.core.services"]

[[tool.importlinter.contracts]]
name = "Core is plain Python: no framework or client libraries"
type = "forbidden"
source_modules = ["papiq.core"]
forbidden_modules = [
    "aioboto3",
    "aiobotocore",
    "aiosqlite",
    "alembic",
    "argon2",
    "asyncpg",
    "authlib",
    "boto3",
    "botocore",
    "cryptography",
    "fastapi",
    "httpx",
    "httpx2",
    "joblib",
    "joserfc",
    "mcp",
    "meilisearch",
    "numpy",
    "ocrmypdf",
    "PIL",
    "pydantic",
    "pydantic_settings",
    "pyotp",
    "pypdfium2",
    "python_multipart",
    "regex",
    "scipy",
    "sklearn",
    "sqlalchemy",
    "starlette",
    "structlog",
    "threadpoolctl",
    "uvicorn",
]

# Libraries without type information.
[[tool.mypy.overrides]]
module = [
    "aioboto3.*",
    "aiobotocore.*",
    "authlib.*",
    "botocore.*",
    "pypdfium2.*",
    "regex.*",
    "sklearn.*",
]
ignore_missing_imports = true

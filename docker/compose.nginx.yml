# Extension of compose.yml or compose.postgres.yml: nginx in front, with a certificate you bring
# (fullchain.pem and privkey.pem in TLS_DIR, e.g. from certbot or your own CA). Lekto is then
# reached only through nginx (its own port is closed).
#
#   .env: DOMAIN, TLS_DIR
#   docker compose -f compose.yml -f compose.nginx.yml up -d
#
# nginx sets X-Forwarded-For to the client's address, so Lekto may trust every address in front
# of it; the events and MCP go unbuffered. Needs Docker Compose 2.24 or newer (configs with
# content, !reset).
services:
  lekto:
    ports: !reset []
    environment:
      LEKTO_COOKIE_SECURE: "true"
      LEKTO_FORWARDED_ALLOW_IPS: "*"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - ${TLS_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      - lekto

configs:
  # nginx's own variables are written $$ (a single $ is Compose's).
  nginx:
    content: |
      server {
          listen 80;
          server_name ${DOMAIN:?set DOMAIN in .env};
          return 301 https://$$host$$request_uri;
      }

      server {
          listen 443 ssl;
          http2 on;
          server_name ${DOMAIN:?set DOMAIN in .env};
          ssl_certificate /etc/nginx/certs/fullchain.pem;
          ssl_certificate_key /etc/nginx/certs/privkey.pem;

          # LEKTO_UPLOAD_MAX_SIZE (100 MB by default).
          client_max_body_size 100m;

          location / {
              proxy_pass http://lekto:8000;
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-For $$remote_addr;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }

          # Server-sent events (minutes to hours) and MCP: unbuffered, long.
          location ~ ^/api/v1/(events|mcp) {
              proxy_pass http://lekto:8000;
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-For $$remote_addr;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_buffering off;
              proxy_read_timeout 1h;
          }
      }

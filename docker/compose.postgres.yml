# Lekto with Postgres, as in operation: the API and the worker in containers of their own (one
# image, `LEKTO_ROLE`), the files on the shared volume `lekto-data`, Meilisearch for the search.
# The language model and the embeddings are outside (see .env).
#
#   cp .env.example .env              # once: "every example" and POSTGRES_PASSWORD
#   docker compose -f compose.postgres.yml up -d
#
# Extensions: compose.workers.yml (more workers), compose.s3.yml (Garage instead of the volume,
# for several servers), compose.ollama.yml, a proxy (compose.caddy.yml, compose.traefik.yml,
# compose.nginx.yml). Run a single API: the event streams assume it; workers can be many.
name: lekto

# What API and worker share: the image and the settings.
x-lekto: &lekto
  image: ghcr.io/tb1337/lekto:latest
  restart: unless-stopped
  # The worker gets 30 s to finish its jobs, s6 waits up to 40 s: see deploy/README.md.
  stop_grace_period: 60s
  extra_hosts:
    # Reaches an Ollama on the host on Linux, too (built in on Docker Desktop and OrbStack).
    - host.docker.internal:host-gateway
  volumes:
    - lekto-data:/data

x-environment: &environment
  PUID: 1000
  PGID: 1000
  LEKTO_SECRET_KEY: ${LEKTO_SECRET_KEY:?set LEKTO_SECRET_KEY in .env}
  LEKTO_ADMIN_USERNAME: admin
  LEKTO_ADMIN_PASSWORD: ${LEKTO_ADMIN_PASSWORD:?set LEKTO_ADMIN_PASSWORD in .env}
  # Plain HTTP on this machine; a proxy example sets it to true.
  LEKTO_COOKIE_SECURE: "false"
  LEKTO_DB_TYPE: postgres
  LEKTO_DB_HOST: postgres
  LEKTO_DB_NAME: lekto
  LEKTO_DB_USER: lekto
  LEKTO_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  LEKTO_MEILISEARCH_URL: http://meilisearch:7700
  LEKTO_MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
  LEKTO_LLM_BASE_URL: ${LEKTO_LLM_BASE_URL:-}
  LEKTO_LLM_MODEL: ${LEKTO_LLM_MODEL:-}
  LEKTO_LLM_API_KEY: ${LEKTO_LLM_API_KEY:-}
  # On a CPU a document takes minutes.
  LEKTO_LLM_TIMEOUT: "600"
  LEKTO_EMBEDDING_BASE_URL: ${LEKTO_EMBEDDING_BASE_URL:-}
  LEKTO_EMBEDDING_MODEL: ${LEKTO_EMBEDDING_MODEL:-}
  LEKTO_EMBEDDING_API_KEY: ${LEKTO_EMBEDDING_API_KEY:-}
  LEKTO_EMBEDDING_QUERY_PREFIX: "query:"
  LEKTO_EMBEDDING_DIMENSIONS: 1024

services:
  # The API (and the web UI): migrates the database at the start.
  lekto:
    <<: *lekto
    ports:
      - 127.0.0.1:${HTTP_PORT:-8000}:8000
    environment:
      <<: *environment
      LEKTO_ROLE: api
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  # The worker: processes the documents; waits for the API to migrate the database.
  lekto-worker:
    <<: *lekto
    environment:
      <<: *environment
      LEKTO_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  postgres:
    image: postgres:17.11-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: lekto
      POSTGRES_DB: lekto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lekto -d lekto"]
      interval: 10s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.54.3
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  lekto-data:
  postgres-data:
  meilisearch-data:
